[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olap-benchmarks"
version = "0.1.0"
description = "OLAP database benchmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "clickhouse-connect>=1.11.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "colorama>=0.4.6",
    "connectorx>=0.4.6",
    "cyclopts>=5.2.0",
    "docker>=7.2.0",
    "duckdb==1.5.6",
    "duckdb-engine>=0.17.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars==2.0.0",
    "pre-commit>=4.7.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "pymysql>=1.2.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyparsing>=3.3.3",
    "python-dotenv>=1.2.4",
    "questdb>=5.0.0",
    "questdb-connect>=1.1.4",
    "setproctitle>=1.3.8",
    "sqlalchemy>=2.0.55",
    "adbc-driver-monetdb==0.13.1",
    "sqlalchemy-monetdb-adbc==0.4.1",
    "taos-ws-py==0.7.0",
]

[project.scripts]
olap = "olap_benchmarks.__main__:app"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "hvplot>=0.12.2",
    "ipykernel>=7.4.0",
    "pyright>=1.1.414",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "pyinstrument>=5.1.3",
    "ruff>=0.17.1",
    "types-colorama>=0.4.15.20260508",
    "types-docker>=7.2.0.20261006",
    "types-psutil>=7.2.2.20260906",
]

[tool.ruff]
line-length = 120
# extend-select rather than select, so ruff's defaults stay on and these are additive
lint.extend-select = ["E", "F", "B", "I", "UP", "C4", "SIM", "ANN"]
lint.ignore = [
    # Timestamps are stored naive throughout (DuckDB TIMESTAMP, and run_metric.time is
    # naive UTC by the datetime.now(UTC).replace(tzinfo=None) convention), so a naive
    # datetime is the deliberate choice here rather than a forgotten timezone.
    "DTZ",
    # Container readiness polling, per-query suite error handling and the metric sampling
    # lanes all have to survive arbitrary driver failures, so they catch broadly on purpose.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles subclass the pydantic Database, where a mutable default is a field default
# that pydantic copies per instance, not shared class state. Annotating these ClassVar
# would remove them as fields and break the fakes.
"olap_benchmarks/tests/*" = ["RUF012"]

[tool.pyright]
include = ["olap_benchmarks"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
reportPrivateUsage = "none"
useLibraryCodeForTypes = true
enableTypeIgnoreComments = false
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportUnusedImport = true
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
# live tests start real engine containers; run them with `pytest -m live`
addopts = "-m 'not live'"
markers = ["live: starts a real engine and runs its select queries (opt-in: pytest -m live)"]
