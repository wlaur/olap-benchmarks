name: Deploy GH pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        working-directory: site
        run: bun install --frozen-lockfile

      # results.db is not committed; it ships as the `data` release asset (see olap publish --upload)
      - name: Fetch published results database
        working-directory: site
        run: bun run fetch-data

      # the committed manifest pins the asset's size and SHA-256, so a stale, truncated or
      # replaced-but-not-recommitted asset fails the build instead of shipping mismatched data
      - name: Verify results database against manifest
        working-directory: site
        run: bun run verify-data

      - name: Check generated database types match the published schema
        working-directory: site
        run: bun run codegen:check

      - name: Build
        working-directory: site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
