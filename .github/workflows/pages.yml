name: Deploy GH pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        working-directory: site
        run: bun install --frozen-lockfile

      # The manifest pins a results-{sha256}.db asset on the `data` release; keep results.db local.
      - name: Fetch published results database
        working-directory: site
        run: bun run fetch-data

      # Verify the fetched local file against the committed size, SHA-256 and storage contract.
      - name: Verify results database against manifest
        working-directory: site
        run: bun run verify-data

      - name: Check generated database types match the published schema
        working-directory: site
        run: bun run codegen:check

      - name: Build
        working-directory: site
        run: bun run build

      - name: Install browser for results compatibility checks
        working-directory: site
        run: bun x playwright install --with-deps chromium

      - name: Verify the browser engine can read the results export
        working-directory: site
        run: bun run test:reader

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
