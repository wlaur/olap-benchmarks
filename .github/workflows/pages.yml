name: Deploy GH pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        working-directory: site
        run: bun install --frozen-lockfile

      # results.db is not committed; it ships as the `data` release asset (see olap publish --upload)
      - name: Fetch published results database
        working-directory: site
        run: bun run fetch-data

      # guard against a truncated or missing asset silently producing a broken site: the DuckDB
      # magic string sits at byte offset 8, after the header checksum
      - name: Verify results database is a DuckDB file
        working-directory: site
        run: |
          test "$(head -c 12 public/data/results.db | tail -c 4)" = "DUCK" \
            || { echo "public/data/results.db is not a DuckDB file; the release asset may be missing"; exit 1; }

      - name: Build
        working-directory: site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
